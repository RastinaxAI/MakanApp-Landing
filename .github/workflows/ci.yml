name: Quality and production images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.21.0', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13.16'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: {version: '0.13.0'}
      - run: npm ci
      - run: uv sync --locked --project apps/api
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: uv run --project apps/api ruff check apps/api scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: uv run --project apps/api python scripts/run-quality.py prepare-test
      - run: docker compose -f compose.test.yaml --env-file .env.test up -d --wait
      - run: uv run --project apps/api python scripts/run-quality.py backend
      - run: uv run --project apps/api python scripts/check-secrets.py
      - name: API dependency scan
        run: |
          uv export --project apps/api --no-dev --no-emit-project --no-hashes --format requirements-txt > .preview/runtime-requirements.txt
          uvx --from pip-audit==2.10.0 pip-audit -r .preview/runtime-requirements.txt --format json --output docs/qa/step10/pip-audit.json
      - if: always()
        run: docker compose -f compose.test.yaml --env-file .env.test down
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: checks, path: docs/qa/step10, retention-days: 7}
  browsers:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.21.0', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13.16'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: {version: '0.13.0'}
      - run: npm ci
      - run: uv sync --locked --project apps/api
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: uv run --project apps/api python scripts/run-quality.py prepare-test
      - run: docker compose -f compose.test.yaml --env-file .env.test up -d --wait
      - run: uv run --project apps/api python scripts/run-quality.py browser --project ${{ matrix.browser }} --spec acceptance
      - run: uv run --project apps/api python scripts/run-quality.py browser --project ${{ matrix.browser }} --spec cms
      - run: uv run --project apps/api python scripts/run-quality.py browser --project ${{ matrix.browser }} --spec seo
      - if: always()
        run: docker compose -f compose.test.yaml --env-file .env.test down
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-${{ matrix.browser }}
          path: docs/qa/step10
          retention-days: 7
  docker:
    needs: [checks, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.13.16'}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: {version: '0.13.0'}
      - run: uv sync --locked --project apps/api
      - run: uv run --project apps/api python scripts/production.py --env-file .preview/ci-production.env init --local-test
      - run: docker compose -f compose.production.yaml --env-file .preview/ci-production.env --profile tools build db web api migrate caddy
      - run: uv run --project apps/api python scripts/test-production.py --env-file .preview/ci-production.env
      - name: Runtime image scan
        run: |
          mkdir -p docs/qa/step10
          for image in makan-landing-api:0.10.0 makan-landing-web:0.10.0 makan-landing-caddy:2.11.7 makan-landing-postgres:17.11; do
            safe_name=$(printf '%s' "$image" | tr ':/' '--')
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/docs/qa/step10:/out" -v "$PWD/infrastructure/security:/policy:ro" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --db-repository ghcr.io/aquasecurity/trivy-db:2 --ignorefile /policy/trivy-ignore.yaml --scanners vuln --severity CRITICAL --exit-code 1 --format json --output "/out/$safe_name.json" "$image"
          done
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: {name: docker-production, path: docs/qa/step10, retention-days: 7}
