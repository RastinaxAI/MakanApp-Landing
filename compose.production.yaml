name: ${COMPOSE_PROJECT_NAME:-makan-landing-prod}

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  AUTH_OTP_DEBUG: 'false'
  AUTH_LEGACY_PASSWORD_LOGIN: 'false'
  AUTH_SECRET: ${AUTH_SECRET:?Set an independent authentication key}
  AUTH_MFA_KEY: ${AUTH_MFA_KEY:?Set an independent MFA key}
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set an independent edge key}
  AUTH_ALLOWED_ORIGINS: '["${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}"]'
  DATABASE_URL: postgresql+psycopg://makan_api:${API_DB_PASSWORD:?Set runtime password}@db:5432/${POSTGRES_DB:-makan_landing}
  MEDIA_ROOT: /srv/media
  SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
  ANALYTICS_EVENT_LIMIT: ${ANALYTICS_EVENT_LIMIT:-240}
  AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-20}
  AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-5}
  AUTH_CHALLENGE_LIMIT: ${AUTH_CHALLENGE_LIMIT:-30}
  FORMS_TOKEN_LIMIT: ${FORMS_TOKEN_LIMIT:-40}
  FORMS_SUBMIT_LIMIT: ${FORMS_SUBMIT_LIMIT:-20}
  FORMS_CONTACT_LIMIT: ${FORMS_CONTACT_LIMIT:-5}

x-service: &service
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  db:
    <<: *service
    image: ${DB_IMAGE:-makan-landing-postgres:17.11}
    build: {context: ./infrastructure/postgres, dockerfile: Dockerfile.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makan_landing}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database administrator password}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set migration password}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set runtime password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    shm_size: 256m
    cpus: 1
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  migrate:
    <<: *service
    profiles: [tools]
    restart: 'no'
    image: ${API_IMAGE:-makan-landing-api:0.10.0}
    build: {context: ./apps/api}
    command: [alembic, upgrade, head]
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql+psycopg://makan_migrator:${MIGRATION_DB_PASSWORD:?Set migration password}@db:5432/${POSTGRES_DB:-makan_landing}
      DB_STATEMENT_TIMEOUT_MS: 30000
    read_only: true
    tmpfs: [/tmp]
    networks: [database]
    depends_on: {db: {condition: service_healthy}}
  api:
    <<: *service
    image: ${API_IMAGE:-makan-landing-api:0.10.0}
    build: {context: ./apps/api}
    environment: *api-environment
    networks: [application, database, sms_egress]
    volumes: [media_data:/srv/media]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 8
    depends_on: {db: {condition: service_healthy}}
  web:
    <<: *service
    image: ${WEB_IMAGE:-makan-landing-web:0.10.0}
    build: {context: ., dockerfile: apps/web/Dockerfile}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: '1'
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    volumes: [web_cache:/srv/makan/apps/web/.next/cache]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    depends_on: {api: {condition: service_healthy}}
  caddy:
    <<: *service
    image: ${PROXY_IMAGE:-makan-landing-caddy:2.11.7}
    build: {context: ., dockerfile: infrastructure/caddy/Dockerfile}
    command: [caddy, run, --config, '${CADDY_CONFIG:-/etc/caddy/Caddyfile}', --adapter, caddyfile]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the public hostname}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set the independent edge key}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080'
      - '${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443'
    networks: [edge, application]
    volumes: [caddy_data:/data, caddy_config:/config]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    depends_on: {web: {condition: service_healthy}}
  maintenance:
    <<: *service
    image: ${API_IMAGE:-makan-landing-api:0.10.0}
    command: [python, -m, app.commands.maintenance, --state-file, /srv/operations/maintenance.json]
    environment: *api-environment
    networks: [database]
    volumes: [operations_data:/srv/operations]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -m, app.commands.maintenance, --check, --state-file, /srv/operations/maintenance.json]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on: {api: {condition: service_healthy}}

networks:
  edge:
  sms_egress:
  application: {internal: true}
  database: {internal: true}
volumes:
  postgres_data:
  media_data:
  web_cache:
  caddy_data:
  caddy_config:
  operations_data:
