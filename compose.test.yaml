name: makan-landing-test
services:
  db-test:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: makan_test_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use separate .env.test}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set test credential}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set test credential}
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - ./infrastructure/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d makan_test_control']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: 'no'
