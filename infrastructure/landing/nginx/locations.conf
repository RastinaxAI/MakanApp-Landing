# Managed by makan landing
# Included by ops.py in the actual application server; no public source tree.
location ~ /\. { return 404; }
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host makanapp.org;
    proxy_hide_header Cache-Control;
    proxy_intercept_errors on;
    error_page 404 = @missing_asset;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
location @missing_asset {
    default_type text/plain;
    return 404 "Asset not found\n";
}
location ~* \.(?:js|css)$ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host makanapp.org;
    proxy_intercept_errors on;
    error_page 404 = @missing_asset;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host makanapp.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Makan-Client-IP $remote_addr;
    include /etc/makan/nginx-proxy.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host makanapp.org;
    proxy_set_header X-Forwarded-Host makanapp.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
}
