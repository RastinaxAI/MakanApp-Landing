# Managed by makan landing
server {
    listen 80;
    listen [::]:80;
    server_name makanapp.org;
    access_log /var/log/nginx/makan-access.log;
    error_log /var/log/nginx/makan-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location / { return 308 https://makanapp.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name makanapp.org;
    ssl_certificate /etc/letsencrypt/live/makanapp.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makanapp.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MakanTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/makan-access.log;
    error_log /var/log/nginx/makan-error.log;
    client_max_body_size 6m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    # APPLICATION_LOCATIONS
}
